[project]
name = "fsval"
version = "0.1.0"
description = "Validation harness: FS vs RASAero II vs RocketPy vs measured flights. Never imports or edits the simulator."
requires-python = ">=3.11"
dependencies = ["numpy", "scipy", "pyyaml", "requests", "matplotlib", "pytest", "numcodecs"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fsval"]
