# Generator (option 3A) training settings. Read by tempest/generator/train.py; unset keys use its DEFAULTS.
noise_dim = 32      # random numbers per sample; fed in with the inputs and into every block's layer norm
width = 512         # hidden units per layer
depth = 4           # residual blocks (about 2.8 M parameters)
m = 4               # samples per row for the loss (ECMWF trains AIFS-CRPS with 4)
crps_alpha = 0.95   # almost-fair CRPS: 1 = fair (degenerate optimum), lower = more like plain CRPS
es_weight = 0.1     # share of the joint energy score next to the per-value CRPS
step_weight = 0.5   # CRPS on height-to-height steps (wind shear); without it samples had 1/2-1/3 of the real shear
members = 4         # independently trained seeds, trained side by side on the GPU, pooled at sampling time
batch = 4096
lr = 1e-3           # AdamW, cosine decay to 0
weight_decay = 1e-4
steps = 6000        # ~13 min for all 4 members on an RTX 5070 Laptop (125 ms per 4-member step); was 20000 (~42 min side by side)
eval_every = 500
patience = 10       # evaluations without improvement before stopping
val_years = 3       # last years of the training span used for validation
val_rows = 50000
seed = 100
# ---- Phase 2 variant p2e: p2d with a stronger shear-tail weight (dose response)
shear_tail_weight = 1.0
shear_tail_q = 0.9

# ---- p2f: P2-e + EMA of the weights (2.5 alone)
ema_decay = 0.999

# ---- C4w training-seed replicate (seed 100, as generator_p2f_s1.toml) of
# ---- C4w (G-GPU 2026-11-09): which part of C4b (m = 16 + 3x weight below 300 m + vector-wind energy score / speed CRPS below 300 m) helps the wind and which costs the humidity?
# p2f + ONLY the near-ground wind term (m = 4, low_weight 1): if the 0-1 km wind gain stays and the RH / rh2m loss goes, the humidity cost came from m = 16 or the 3x weight.
wind_vec_weight = 0.5
low_top_m = 300.0
