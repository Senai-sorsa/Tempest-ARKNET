# Reference: generator.toml with the old 20000 steps, to check the 6000-step speed cut (PLAN row 21).
noise_dim = 32      # random numbers per sample; fed in with the inputs and into every block's layer norm
width = 512         # hidden units per layer
depth = 4           # residual blocks (about 2.8 M parameters)
m = 4               # samples per row for the loss (ECMWF trains AIFS-CRPS with 4)
crps_alpha = 0.95   # almost-fair CRPS: 1 = fair (degenerate optimum), lower = more like plain CRPS
es_weight = 0.1     # share of the joint energy score next to the per-value CRPS
step_weight = 0.5   # CRPS on height-to-height steps (wind shear); without it samples had 1/2-1/3 of the real shear
members = 4         # independently trained seeds, trained side by side on the GPU, pooled at sampling time
batch = 4096
lr = 1e-3           # AdamW, cosine decay to 0
weight_decay = 1e-4
steps = 20000
eval_every = 500
patience = 10       # evaluations without improvement before stopping
val_years = 3       # last years of the training span used for validation
val_rows = 50000
seed = 0
